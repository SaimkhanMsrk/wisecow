name: CI/CD - Build, Push & Deploy to GKE Autopilot

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Cache node_modules
      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-

      # 3️⃣ Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4️⃣ Build Docker image
      - name: Build Docker image
        run: |
          IMAGE_NAME=saimkhanmsrk/wisecow
          COMMIT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          docker build --cache-from $IMAGE_NAME:latest -t $IMAGE_NAME:latest -t $IMAGE_NAME:$COMMIT_SHA .

      # 5️⃣ Push Docker image
      - name: Push Docker image
        run: |
          IMAGE_NAME=saimkhanmsrk/wisecow
          COMMIT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$COMMIT_SHA

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout the code (optional for deploy)
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Set up gcloud CLI
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      # 3️⃣ Configure kubectl
      - name: Set up kubectl
        run: |
          gcloud container clusters get-credentials <CLUSTER_NAME> --zone <ZONE> --project ${{ secrets.GCP_PROJECT_ID }}

      # 4️⃣ Deploy to GKE
      - name: Deploy to GKE
        run: |
          IMAGE_NAME=saimkhanmsrk/wisecow
          COMMIT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          kubectl set image deployment/<DEPLOYMENT_NAME> <CONTAINER_NAME>=$IMAGE_NAME:$COMMIT_SHA
